name: Peak
description: 'Peak is a consumer brain-training mobile application operated by Synaptic
  Labs (formerly Peak Labs) that offers cognitive exercise games and personalized workouts
  spanning memory, attention, problem-solving, mental agility, language, and emotion.
  Its games and Advanced Training Programmes are developed with researchers from institutions
  including Cambridge, Yale, UCL, and King''s College London. Peak Pro is a subscription
  that unlocks 40+ games, personalized workouts, performance analytics, and an AI Coach.
  Peak is a mobile-only consumer product distributed via the App Store and Google Play
  and does not currently publish a public API or developer platform.'
